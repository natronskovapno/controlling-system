<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600"
     role="img" aria-label="Seven external sources reach the system two ways: three APIs polled by idempotent per-date connectors, and four file types parsed on upload. Both write to transaction tables in SQLite, which are the source of truth; aggregate tables are recomputed from them, and 24 Flask modules read both." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6560"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b08828"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="600" fill="#fbfaf8"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">

    <!-- ══════════ column headings ══════════ -->
    <g font-size="11" font-weight="700" fill="#8a837c" letter-spacing="1.1">
      <text x="30"  y="30">EXTERNAL SOURCES</text>
      <text x="320" y="30">INGESTION</text>
      <text x="600" y="30">SQLITE · 64 TABLES</text>
      <text x="910" y="30">FLASK · 24 BLUEPRINTS</text>
    </g>

    <!-- ══════════ A. sources ══════════ -->
    <text x="30" y="54" font-size="10.5" font-weight="600" fill="#b08828"
          letter-spacing=".4">POLLED AUTOMATICALLY</text>
    <g>
      <rect x="30" y="62"  width="230" height="46" rx="7" fill="#fff" stroke="#d9d3ca"/>
      <text x="46" y="81"  font-size="12.5" font-weight="600" fill="#2b2a28">POS back office</text>
      <text x="46" y="97"  font-size="10.5" fill="#6b6560">REST · receipts, stock, documents</text>

      <rect x="30" y="115" width="230" height="46" rx="7" fill="#fff" stroke="#d9d3ca"/>
      <text x="46" y="134" font-size="12.5" font-weight="600" fill="#2b2a28">National e-invoicing</text>
      <text x="46" y="150" font-size="10.5" fill="#6b6560">REST · purchase and sales invoices</text>

      <rect x="30" y="168" width="230" height="46" rx="7" fill="#fff" stroke="#d9d3ca"/>
      <text x="46" y="187" font-size="12.5" font-weight="600" fill="#2b2a28">Web analytics</text>
      <text x="46" y="203" font-size="10.5" fill="#6b6560">GraphQL · daily visit counts</text>
    </g>

    <text x="30" y="240" font-size="10.5" font-weight="600" fill="#8a837c"
          letter-spacing=".4">UPLOADED BY HAND</text>
    <g>
      <rect x="30" y="250" width="230" height="46" rx="7" fill="#fff" stroke="#d9d3ca"/>
      <text x="46" y="269" font-size="12.5" font-weight="600" fill="#2b2a28">Bank statements</text>
      <text x="46" y="285" font-size="10.5" fill="#6b6560">XML · RSD current accounts</text>

      <rect x="30" y="303" width="230" height="46" rx="7" fill="#fff" stroke="#d9d3ca"/>
      <text x="46" y="322" font-size="12.5" font-weight="600" fill="#2b2a28">FX statements</text>
      <text x="46" y="338" font-size="10.5" fill="#6b6560">PDF · foreign currency accounts</text>

      <rect x="30" y="356" width="230" height="46" rx="7" fill="#fff" stroke="#d9d3ca"/>
      <text x="46" y="375" font-size="12.5" font-weight="600" fill="#2b2a28">Trial balances</text>
      <text x="46" y="391" font-size="10.5" fill="#6b6560">PDF or XLSX · from the bookkeeper</text>

      <rect x="30" y="409" width="230" height="46" rx="7" fill="#fff" stroke="#d9d3ca"/>
      <text x="46" y="428" font-size="12.5" font-weight="600" fill="#2b2a28">Payroll and invoice PDFs</text>
      <text x="46" y="444" font-size="10.5" fill="#6b6560">XLSX shift sheets · issued invoices</text>
    </g>

    <!-- ══════════ B. ingestion ══════════ -->
    <rect x="320" y="62" width="220" height="152" rx="7" fill="#fff" stroke="#b08828" stroke-width="1.5"/>
    <text x="336" y="83" font-size="12.5" font-weight="600" fill="#2b2a28">Connectors</text>
    <line x1="336" y1="93" x2="524" y2="93" stroke="#e6e0d6"/>
    <g font-size="11" fill="#4a4641">
      <text x="336" y="112">One day per request</text>
      <text x="336" y="131">Cursor per source</text>
      <text x="336" y="150">Retry with backoff</text>
      <text x="336" y="169">Lazy daily catch-up</text>
      <text x="336" y="188">Every run logged</text>
    </g>
    <text x="336" y="207" font-size="10.5" font-weight="600" fill="#b08828">Delete-then-insert per date</text>

    <rect x="320" y="250" width="220" height="205" rx="7" fill="#fff" stroke="#d9d3ca"/>
    <text x="336" y="271" font-size="12.5" font-weight="600" fill="#2b2a28">Parsers</text>
    <line x1="336" y1="281" x2="524" y2="281" stroke="#e6e0d6"/>
    <g font-size="11" fill="#4a4641">
      <text x="336" y="300">Format detected per file</text>
      <text x="336" y="319">Parsed to a preview first,</text>
      <text x="336" y="335">committed only on confirm</text>
      <text x="336" y="354">Duplicates skipped on a</text>
      <text x="336" y="370">natural key</text>
      <text x="336" y="389">Totals checked before</text>
      <text x="336" y="405">anything is written</text>
      <text x="336" y="424">Original file archived</text>
    </g>

    <!-- ══════════ C. database ══════════ -->
    <rect x="600" y="62" width="250" height="290" rx="7" fill="#fff" stroke="#d9d3ca"/>
    <text x="616" y="83" font-size="12.5" font-weight="600" fill="#2b2a28">Transaction tables</text>
    <text x="616" y="98" font-size="10" fill="#8a837c">the source of truth</text>
    <g font-size="11" fill="#4a4641">
      <text x="616" y="122">bills · bill_items</text>
      <text x="616" y="142">invoices_in · invoices_out</text>
      <text x="616" y="162">invoice_line_items</text>
      <text x="616" y="182">bank_transactions · fx_*</text>
      <text x="616" y="202">events_daily_log · wages_daily</text>
      <text x="616" y="222">documents_raw · stock levels</text>
      <text x="616" y="242">bb_snapshots · bb_lines</text>
      <text x="616" y="262">web_analytics_*</text>
      <text x="616" y="282">ingestion_log · errors</text>
    </g>
    <text x="616" y="308" font-size="10.5" font-style="italic" fill="#8a837c">… 40 more, including the</text>
    <text x="616" y="323" font-size="10.5" font-style="italic" fill="#8a837c">second entity, fixed costs,</text>
    <text x="616" y="338" font-size="10.5" font-style="italic" fill="#8a837c">tags and reference data</text>

    <rect x="600" y="368" width="250" height="87" rx="7" fill="#fff" stroke="#d9d3ca" stroke-dasharray="4 3"/>
    <text x="616" y="389" font-size="12.5" font-weight="600" fill="#2b2a28">Derived aggregates</text>
    <text x="616" y="404" font-size="10" fill="#8a837c">recomputed, never entered</text>
    <g font-size="11" fill="#4a4641">
      <text x="616" y="426">sales_hourly · payment_hourly</text>
      <text x="616" y="446">cogs_daily · inventory_daily · pdv_working</text>
    </g>

    <!-- ══════════ D. modules ══════════ -->
    <rect x="910" y="62" width="300" height="393" rx="7" fill="#fff" stroke="#d9d3ca"/>
    <text x="926" y="83" font-size="12.5" font-weight="600" fill="#2b2a28">Modules</text>
    <line x1="926" y1="93" x2="1194" y2="93" stroke="#e6e0d6"/>
    <g font-size="11" fill="#4a4641">
      <text x="926" y="113">Daily log · event P&amp;L and overrides</text>
      <text x="926" y="133">Cash position · payment proposal</text>
      <text x="926" y="153">Invoices · ageing, PDF import</text>
      <text x="926" y="173">Bank · tagging, transfers, FX</text>
      <text x="926" y="193">Fixed costs · tags and allocation</text>
      <text x="926" y="213">VAT return · per entity, per period</text>
      <text x="926" y="233">Financial statements · balance sheet,</text>
      <text x="926" y="249">income statement, cash flow</text>
      <text x="926" y="269">Trial balances · import and mapping</text>
      <text x="926" y="289">Projections · by event type and venue</text>
      <text x="926" y="309">Performance · realised vs projected</text>
      <text x="926" y="329">Wages · shifts, salaries, brackets</text>
      <text x="926" y="349">Stock · closing levels by product</text>
      <text x="926" y="369">Discounts · transfers · cards</text>
      <text x="926" y="389">Second entity · its own ledgers</text>
      <text x="926" y="409">Consistency checks · run on live data</text>
      <text x="926" y="429">Read-only SQL API</text>
    </g>
    <text x="926" y="448" font-size="10.5" font-style="italic" fill="#8a837c">… plus ingestion control and export</text>

    <!-- ══════════ arrows ══════════ -->
    <g stroke="#6b6560" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
      <line x1="260" y1="85"  x2="314" y2="85"/>
      <line x1="260" y1="138" x2="314" y2="138"/>
      <line x1="260" y1="191" x2="314" y2="191"/>
      <line x1="260" y1="273" x2="314" y2="273"/>
      <line x1="260" y1="326" x2="314" y2="326"/>
      <line x1="260" y1="379" x2="314" y2="379"/>
      <line x1="260" y1="432" x2="314" y2="432"/>
    </g>

    <line x1="540" y1="138" x2="594" y2="138" stroke="#b08828" stroke-width="1.6" marker-end="url(#arrowGold)"/>
    <line x1="540" y1="300" x2="594" y2="300" stroke="#6b6560" stroke-width="1.3" marker-end="url(#arrow)"/>

    <line x1="650" y1="352" x2="650" y2="362" stroke="#b08828" stroke-width="1.6" marker-end="url(#arrowGold)"/>
    <text x="666" y="363" font-size="10.5" font-weight="600" fill="#b08828">derived from</text>

    <g stroke="#6b6560" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
      <line x1="850" y1="200" x2="904" y2="200"/>
      <line x1="850" y1="411" x2="904" y2="411"/>
    </g>

    <!-- ══════════ footnotes ══════════ -->
    <line x1="30" y1="492" x2="1210" y2="492" stroke="#e6e0d6"/>
    <g font-size="11" fill="#4a4641">
      <text x="30" y="517" font-weight="600" fill="#2b2a28">Re-running a day corrects it</text>
      <text x="30" y="535">Each connector deletes and reinserts the</text>
      <text x="30" y="551">date it is importing, so a retry or a late</text>
      <text x="30" y="567">correction never duplicates rows.</text>

      <text x="320" y="517" font-weight="600" fill="#2b2a28">Lazy, not scheduled</text>
      <text x="320" y="535">The first page load of the day fires a</text>
      <text x="320" y="551">background catch-up. The machine is off</text>
      <text x="320" y="567">at weekends, so cron would miss days.</text>

      <text x="600" y="517" font-weight="600" fill="#2b2a28">Two legal entities</text>
      <text x="600" y="535">share one pipeline but file separate VAT</text>
      <text x="600" y="551">returns, so every revenue and cost stream</text>
      <text x="600" y="567">carries the entity it belongs to.</text>

      <text x="910" y="517" font-weight="600" fill="#2b2a28">Demo mode</text>
      <text x="910" y="535">disables every write and outbound call, so</text>
      <text x="910" y="551">the public demo is safe to leave running</text>
      <text x="910" y="567">without a login.</text>
    </g>
  </g>
</svg>
