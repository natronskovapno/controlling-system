{% extends "base.html" %}
{% block title %}{{ tr('Novi unos') }}{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header__left">
    <h1 class="page-title">{{ tr('Ručni unos') }}</h1>
    <p class="page-subtitle">{{ tr('Dodaj fiksni trošak ili prihod za određeni mesec') }}</p>
  </div>
  <div class="page-header__actions">
    <a href="{{ url_for('fixed_costs.index', year=year) }}" class="btn btn-secondary">{{ tr('← Nazad') }}</a>
  </div>
</div>

<form method="post" style="max-width:580px;">
  <div class="card mb-3">
    <div class="card-header"><span class="card-title">{{ tr('Stavka') }}</span></div>
    <div class="card-body">
      <div class="form-row">
        <div class="form-group">
          <label>{{ tr('Godina') }}</label>
          <select name="year">
            {% for y in years %}
              <option value="{{ y }}" {{ 'selected' if y == year }}>{{ y }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>{{ tr('Mesec') }}</label>
          <select name="month">
            {% for i, m in enumerate(months_sr) %}
              <option value="{{ i+1 }}" {{ 'selected' if i+1 == month }}>{{ m }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-group" style="margin-top:12px;">
        <label>{{ tr('Kategorija *') }}</label>
        <select name="tag_id" required>
          <optgroup label="Troškovi">
            {% for t in tags if t.type == 'expense' %}
              <option value="{{ t.tag_id }}">{{ tr(t.name) }}</option>
            {% endfor %}
          </optgroup>
          <optgroup label="Prihodi">
            {% for t in tags if t.type == 'income' %}
              <option value="{{ t.tag_id }}">{{ tr(t.name) }}</option>
            {% endfor %}
          </optgroup>
        </select>
      </div>
      <div class="form-row" style="margin-top:12px;">
        <div class="form-group">
          <label>{{ tr('Iznos (RSD) *') }}</label>
          <input type="number" step="0.01" name="amount" required placeholder="0.00">
        </div>
      </div>
      <div class="form-group" style="margin-top:12px;">
        <label>{{ tr('Napomena') }}</label>
        <input type="text" name="notes" placeholder="{{ tr('Opciono') }}">
      </div>
    </div>
  </div>
  <div style="display:flex;gap:10px;justify-content:flex-end;">
    <a href="{{ url_for('fixed_costs.index', year=year) }}" class="btn btn-secondary">{{ tr('Otkaži') }}</a>
    <button type="submit" class="btn btn-primary">{{ tr('Dodaj stavku') }}</button>
  </div>
</form>
{% endblock %}
